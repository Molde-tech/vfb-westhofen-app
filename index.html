const firebaseConfig={apiKey:"AIzaSyDXzKjeyfGAybqM015oINBPqjLk1TedE68",authDomain:"vfb-westhofen-app.firebaseapp.com",projectId:"vfb-westhofen-app",storageBucket:"vfb-westhofen-app.firebasestorage.app",messagingSenderId:"405760041608",appId:"1:405760041608:web:bd3d572508cede413bf53d"};
const DOC_ID='garagenstadion',PRICE=1,WARN=10,KEY='garagenstadion_session';
const PRODUCTS={beer:{name:'Bier',icon:'🍺',price:1},softdrink:{name:'Softdrink',icon:'🥤',price:1.5},schnaps:{name:'Schnaps',icon:'🥃',price:1},longdrink:{name:'Longdrink',icon:'🍹',price:3},eis:{name:'Eis',icon:'🍦',price:1.5},snacks:{name:'Chips & Süßigkeiten',icon:'🍫',price:2}};
let S={schema:4,club:{name:'Garagenstadion',code:'',slogan:'Kaltgetränke · gute Leute · keine Ausreden'},users:[],drinks:[],cash:[],events:[],log:[]},session={me:null,verified:false},tab='home',sheet='',edit='',day='',ref=null,loaded=false,applying=false,saving=false,pending=false,lastVersion=null,listenerStarted=false;
const E=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),eu=n=>Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}),me=()=>S.users.find(u=>u.id===session.me),role=()=>me()?.role,master=()=>role()==='master',canStripe=()=>['master','tablet'].includes(role());
function normalize(){S.schema=4;S.club=S.club||{name:'Garagenstadion',code:'',slogan:''};S.users=S.users||S.members||[];S.drinks=S.drinks||S.beers||[];S.cash=S.cash||[];S.events=S.events||[];S.events.forEach(e=>{e.responses=e.responses||{}});S.log=S.log||[];if(!S.club.code)S.club.code=Math.random().toString(36).slice(2,8).toUpperCase();S.users.forEach(u=>{u.credit=Number(u.credit||u.creditBeer||0);u.role=u.role==='admin'?'master':(u.role||'member');u.pin=String(u.pin||'1234')});S.drinks.forEach(x=>{x.user=x.user||x.member;x.price=Number(x.price||x.amount||PRICE);x.product=x.product||'beer';x.productName=x.productName||(PRODUCTS[x.product]?.name||'Bier');x.creditUsed=Number(x.creditUsed||0);x.open=Number(x.open??(x.paid?0:x.price));x.ts=x.ts||new Date((x.date||today())+'T12:00:00').toISOString();x.date=x.date||today()})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(session));localStorage.setItem('garage_last_user',session.me||'')}catch(e){console.error('Sitzung konnte nicht gespeichert werden',e)}}function loadSession(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem('garage_v4_session')||localStorage.getItem('garage_v3_session')||'{}';session={...session,...JSON.parse(raw)};if(!session.me)session.me=localStorage.getItem('garage_last_user')||null}catch(e){console.error('Sitzung konnte nicht geladen werden',e)}}function audit(kind,text,user=null,amount=null){S.log.push({id:uid(),ts:new Date().toISOString(),by:session.me,kind,text,user,amount});if(S.log.length>1000)S.log=S.log.slice(-1000)}
function save(){persist();if(!ref||!loaded||applying)return;if(saving){pending=true;return}saving=true;const payload=JSON.parse(JSON.stringify(S));const expectedVersion=Number(lastVersion||0);firebase.firestore().runTransaction(async tx=>{const snap=await tx.get(ref);const serverVersion=snap.exists?Number(snap.data().version||0):0;if(serverVersion!==expectedVersion){const err=new Error('STALE_DATA');err.serverVersion=serverVersion;throw err}tx.set(ref,{db:payload,version:serverVersion+1,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});return serverVersion+1}).then(newVersion=>{lastVersion=newVersion}).catch(e=>{console.error(e);if(e.message==='STALE_DATA'){pending=false;alert('Die Daten wurden inzwischen auf einem anderen Gerät geändert. Deine Änderung wurde zum Schutz NICHT gespeichert. Die App lädt jetzt den aktuellen Stand neu.');location.reload();return}alert('Speichern fehlgeschlagen: '+e.message)}).finally(()=>{saving=false;if(pending){pending=false;save()}})}
function start(){loadSession();firebase.initializeApp(firebaseConfig);ref=firebase.firestore().collection('apps').doc(DOC_ID);firebase.auth().onAuthStateChanged(u=>{if(u&&!listenerStarted){listenerStarted=true;listen()}});firebase.auth().signInAnonymously().catch(e=>app.innerHTML='<div class="empty">Firebase-Anmeldung fehlgeschlagen: '+esc(e.message)+'</div>')}
function listen(){ref.onSnapshot(s=>{if(s.exists&&s.data().db){applying=true;S=s.data().db;normalize();lastVersion=Number(s.data().version||0);loaded=true;applying=false;render()}else if(!s.metadata.fromCache){normalize();loaded=true;lastVersion=0;render()}},e=>app.innerHTML='<div class="empty">Firebase-Synchronisierung fehlgeschlagen: '+esc(e.message)+'</div>')}
function count(id,d=''){return S.drinks.filter(x=>x.user===id&&(!d||x.date===d)).length}function openAmt(id){return S.drinks.filter(x=>x.user===id).reduce((a,x)=>a+Number(x.open||0),0)}function credit(id){return Number(S.users.find(x=>x.id===id)?.credit||0)}function totalOpen(){return S.users.reduce((a,u)=>a+openAmt(u.id),0)}function totalCredit(){return S.users.reduce((a,u)=>a+credit(u.id),0)}function till(){return S.cash.reduce((a,x)=>a+Number(x.amount||0),0)}function tally(n){let s='';for(let i=1;i<=n;i++)s+=i%5===0?'┃ ':'│';return s||'–'}
function nav(){let a=[['home','🏚️','Start'],['striche','𝍷','Striche'],['kasse','💶','Kasse'],['termine','📅','Termine'],['leute','👥','Leute']];if(master())a.push(['protokoll','📋','Protokoll']);return `<nav class="nav">${a.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';sheet='';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function layout(b){return `<div class="app"><header class="head"><div class="brand"><div class="logo"></div><div><div class="title">${esc(S.club.name)}</div><div class="sub">${esc(S.club.slogan)}</div><div class="sync">Cloud verbunden</div></div></div><button class="chip" onclick="show('profile')">${esc(me()?.name||'Profil')}</button></header><main class="content">${b}</main>${nav()}${modal()}</div>`}
function summary(){return `<div class="grid"><div class="card stat"><span class="muted">Offen gesamt</span><strong class="danger">${eu(totalOpen())}</strong></div><div class="card stat"><span class="muted">Guthaben gesamt</span><strong>${eu(totalCredit())}</strong></div><div class="card stat"><span class="muted">Bierkasse</span><strong>${eu(till())}</strong></div></div>`}function account(u){let o=openAmt(u.id);return `<div class="card ${o>=WARN?'warn':''}"><div class="row"><div><div class="name">${esc(u.name)}</div><span class="badge">${u.role==='master'?'Garagenmeister':u.role==='tablet'?'Tablet':'Mitglied'}</span></div><div style="text-align:right"><div class="money">Guthaben ${eu(credit(u.id))}</div><div class="${o>=WARN?'danger':'muted'}">Offen ${eu(o)}</div></div></div>${o>=WARN?`<p class="danger">⚠ Offener Betrag hat ${eu(WARN)} erreicht.</p>`:''}${canStripe()&&u.role!=='tablet'?`<div class="btnrow"><button class="btn" onclick="show('product','${u.id}')">🛒 Artikel buchen</button>${master()?`<button class="btn blue" onclick="show('deposit','${u.id}')">+ Guthaben</button>`:''}</div>`:''}</div>`}
function home(){let u=me(),next=[...S.events].filter(e=>e.date>=today()).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))[0];if(role()==='tablet')return `<div class="hero"><h2>Tablet-Modus</h2><p class="muted">Mitglied auswählen und Artikel buchen.</p></div>${summary()}<div class="section">Artikel buchen</div>${S.users.filter(x=>x.role!=='tablet').map(account).join('')}`;return `<div class="hero"><h2>Willkommen, ${esc(u.name)}</h2><div class="muted">${master()?'Vollzugriff als Garagenmeister':'Dein persönlicher Überblick'}</div></div>${master()?summary():account(u)}${master()?`<div class="section">Alle Konten</div>${S.users.filter(x=>x.role!=='tablet').map(account).join('')}`:''}<div class="section">Nächster Termin</div>${next?eventCard(next):'<div class="card muted">Noch kein Termin.</div>'}`}
function striche(){let days=[...new Set(S.drinks.map(x=>x.date))].sort().reverse();return `<div class="section">Strichliste</div><div class="card"><label>Tag</label><select onchange="day=this.value;render()"><option value="">Gesamt</option>${days.map(d=>`<option value="${d}" ${day===d?'selected':''}>${fmt(d)}</option>`).join('')}</select></div>${S.users.filter(x=>x.role!=='tablet').map(u=>`<div class="card"><div class="row"><div class="grow"><div class="name">${esc(u.name)}</div><div class="tally">${tally(count(u.id,day))}</div><div class="muted">${count(u.id,day)} Striche · offen ${eu(openAmt(u.id))} · Guthaben ${eu(credit(u.id))}</div></div>${canStripe()?`<button class="btn" onclick="show('product','${u.id}')">+ Artikel</button>`:''}</div>${master()&&count(u.id)?`<button class="btn red block" style="margin-top:8px" onclick="removeLast('${u.id}')">Letzten Strich korrigieren</button>`:''}</div>`).join('')}`}
function cashList(){return [...S.cash].sort((a,b)=>String(b.ts).localeCompare(String(a.ts))).map(x=>{let u=S.users.find(z=>z.id===x.user);return `<div class="line row"><div><b>${esc(x.note)}</b><div class="muted">${new Date(x.ts).toLocaleString('de-DE')}${u?' · '+esc(u.name):''}</div></div><span class="${x.amount>=0?'ok':'danger'}">${x.amount>=0?'+':''}${eu(x.amount)}</span></div>`}).join('')||'<div class="empty">Noch keine Buchungen.</div>'}function kasse(){let u=me();if(!master())return `<div class="section">Mein Konto</div>${account(u)}<div class="card row"><span>Bierkasse insgesamt</span><b>${eu(till())}</b></div>`;return `<div class="section">Kassenübersicht</div>${summary()}<div class="btnrow"><button class="btn blue" onclick="show('deposit')">Guthaben einzahlen</button><button class="btn" onclick="show('special')">Ein-/Ausgabe</button></div><div class="section">Buchungen</div><div class="card">${cashList()}</div>`}
function eventCard(e){e.responses=e.responses||{};let my=e.responses[session.me]||'',yes=Object.values(e.responses).filter(x=>x==='yes').length,no=Object.values(e.responses).filter(x=>x==='no').length;let actions=role()!=='tablet'?`<div class="btnrow"><button class="btn green" style="${my==='yes'?'outline:3px solid #fff;':''}" onclick="respondEvent('${e.id}','yes')">✓ Zusagen</button><button class="btn red" style="${my==='no'?'outline:3px solid #fff;':''}" onclick="respondEvent('${e.id}','no')">✕ Absagen</button></div>`:'';return `<div class="card event"><div class="row"><div class="grow"><b>${esc(e.title)}</b><div class="muted">${fmt(e.date)}${e.time?' · '+esc(e.time)+' Uhr':''}${e.place?' · '+esc(e.place):''}</div>${e.note?`<div>${esc(e.note)}</div>`:''}</div>${master()?`<button class="btn red" onclick="delEvent('${e.id}')">×</button>`:''}</div>${role()!=='tablet'?`<div class="muted" style="margin-top:8px">Deine Antwort: ${my==='yes'?'<span class="ok">Zugesagt</span>':my==='no'?'<span class="danger">Abgesagt</span>':'Noch offen'}</div>`:''}${master()?`<div class="muted" style="margin-top:5px">Zusagen: ${yes} · Absagen: ${no}</div>`:''}${actions}</div>`}
function respondEvent(id,response){if(role()==='tablet')return;let e=S.events.find(x=>x.id===id);if(!e)return alert('Termin nicht gefunden.');e.responses=e.responses||{};e.responses[session.me]=response;audit('event',(response==='yes'?'Termin zugesagt: ':'Termin abgesagt: ')+e.title,session.me);save();render()}
function termine(){let l=[...S.events].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));return `<div class="section">Termine</div>${l.map(eventCard).join('')||'<div class="empty">Keine Termine.</div>'}${master()?`<button class="btn block" onclick="show('event')">+ Termin</button>`:''}`}
function leute(){return `<div class="section">Benutzer</div>${S.users.map(u=>`<div class="card row"><div><div class="name">${esc(u.name)}</div><span class="badge">${u.role==='master'?'Garagenmeister':u.role==='tablet'?'Tablet-Account':'Mitglied'}</span></div>${master()&&u.id!==session.me?`<button class="btn ghost" onclick="show('editUser','${u.id}')">Ändern</button>`:''}</div>`).join('')}${master()?`<div class="btnrow"><button class="btn blue" onclick="show('invite')">QR-Einladung</button>${S.users.some(x=>x.role==='tablet')?'':`<button class="btn" onclick="show('tablet')">+ Tablet</button>`}</div>`:''}`}
function protokoll(){if(!master())return'';let l=[...S.log].sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));return `<div class="section">Protokoll</div><button class="btn ghost block" onclick="exportBackup()">Backup herunterladen</button><div class="card" style="margin-top:10px">${l.map(x=>{let by=S.users.find(u=>u.id===x.by),u=S.users.find(u=>u.id===x.user);return `<div class="line"><b>${esc(x.text)}</b><div class="muted">${new Date(x.ts).toLocaleString('de-DE')}${u?' · '+esc(u.name):''} · von ${esc(by?.name||'System')}</div></div>`}).join('')||'<div class="empty">Noch keine Einträge.</div>'}</div>`}
function invitationFromUrl(){return new URLSearchParams(location.search).get('invite')||''}function clearInviteUrl(){history.replaceState({},'',location.pathname)}function useExistingAccount(){const saved=String(S.club.code||'').trim().toUpperCase();session.inviteHandled=saved;session.verified=true;session.me=null;persist();clearInviteUrl();render()}function gate(){if(!loaded)return '<div class="empty">Lade Cloud-Daten…</div>';if(!S.users.length)return createView();const incoming=invitationFromUrl().trim().toUpperCase(),saved=String(S.club.code||'').trim().toUpperCase(),handled=String(session.inviteHandled||'').trim().toUpperCase();if(incoming&&saved&&incoming===saved&&handled!==saved&&!me())return joinView();if(me()){session.verified=true;persist();return null}session.verified=true;persist();return pickView()}function createView(){return `<div class="app"><main class="content"><div class="hero"><h2>Garagenstadion eröffnen</h2><label>Name</label><input id="club" value="Garagenstadion"><label>Dein Name</label><input id="owner"><label>PIN</label><input id="pin" type="password"><button class="btn block" style="margin-top:10px" onclick="createClub()">Eröffnen</button></div></main></div>`}function codeView(){return `<div class="app"><main class="content"><div class="hero"><h2>Einladungscode</h2><input id="code"><button class="btn block" style="margin-top:10px" onclick="verifyCode()">Weiter</button></div></main></div>`}function joinView(){return `<div class="app"><main class="content"><div class="hero"><h2>Erstanmeldung</h2><p class="muted">Lege deinen Namen und deine persönliche PIN fest.</p><label>Name</label><input id="jn"><label>PIN (mind. 4 Zeichen)</label><input id="jp" type="password"><label>PIN bestätigen</label><input id="jp2" type="password"><button class="btn green block" style="margin-top:10px" onclick="join()">Mitgliedskonto anlegen</button><button class="btn ghost block" style="margin-top:8px" onclick="useExistingAccount()">Bestehendes Konto verwenden</button></div></main></div>`}function pickView(){return `<div class="app"><main class="content"><div class="hero"><h2>Benutzer wählen</h2>${S.users.map(u=>`<button class="chip block" style="margin-top:7px" onclick="showLogin('${u.id}')">${esc(u.name)} · ${u.role==='tablet'?'Tablet':u.role==='master'?'Garagenmeister':'Mitglied'}</button>`).join('')}</div>${modal()}</main></div>`}
function render(){let g=gate();if(g)return app.innerHTML=g;let b=tab==='home'?home():tab==='striche'?striche():tab==='kasse'?kasse():tab==='termine'?termine():tab==='leute'?leute():protokoll();app.innerHTML=layout(b);if(sheet==='invite')setTimeout(drawQR,0)}function show(s,id=''){sheet=s;edit=id;render()}function closeSheet(){sheet='';edit='';render()}function showLogin(id){sheet='login';edit=id;render()}
function inviteUrl(){return location.origin+location.pathname+'?invite='+encodeURIComponent(S.club.code)}function drawQR(){let q=E('qrcode');if(q&&window.QRCode){q.innerHTML='';new QRCode(q,{text:inviteUrl(),width:220,height:220})}}function modal(){if(!sheet)return'';let b='';if(sheet==='login'){let u=S.users.find(x=>x.id===edit);b=`<h3>${esc(u?.name)}</h3><label>PIN</label><input id="lp" type="password"><button class="btn block" onclick="doLogin()">Anmelden</button>`}if(sheet==='profile')b=`<h3>Profil</h3><div class="card"><b>${esc(me()?.name)}</b><div class="muted">${role()}</div></div>${master()?`<button class="btn blue block" onclick="show('invite')">QR-Einladung anzeigen</button>`:''}<button class="btn ghost block" style="margin-top:8px" onclick="session.me=null;session.verified=true;session.inviteHandled=String(S.club.code||'').trim().toUpperCase();persist();clearInviteUrl();closeSheet()">Benutzer wechseln</button>`;if(sheet==='invite')b=`<h3>QR-Einladung</h3><p class="muted">QR-Code scannen. Neues Mitglied vergibt Name und PIN selbst.</p><div id="qrcode"></div><label>Einladungslink</label><input readonly value="${esc(inviteUrl())}" onclick="this.select()"><label>Code</label><input readonly value="${esc(S.club.code)}" onclick="this.select()">`;if(sheet==='tablet')b=`<h3>Tablet-Account anlegen</h3><label>Name</label><input id="un" value="Garagen-Tablet"><label>PIN</label><input id="up" value="1234"><button class="btn block" onclick="addTablet()">Anlegen</button>`;if(sheet==='editUser'){let u=S.users.find(x=>x.id===edit);b=`<h3>Benutzer bearbeiten</h3><label>Name</label><input id="en" value="${esc(u.name)}"><label>Neue PIN (optional)</label><input id="ep"><label>Rolle</label><select id="er"><option value="member" ${u.role==='member'?'selected':''}>Mitglied</option><option value="tablet" ${u.role==='tablet'?'selected':''}>Tablet</option><option value="master" ${u.role==='master'?'selected':''}>Garagenmeister</option></select><button class="btn block" onclick="editUser()">Speichern</button><button class="btn red block" style="margin-top:8px" onclick="deleteUser('${u.id}')">Löschen</button>`}if(sheet==='product'){let u=S.users.find(x=>x.id===edit);b=`<h3>Artikel für ${esc(u?.name||'Mitglied')}</h3><p class="muted">Artikel antippen. Die Buchung erfolgt sofort.</p><div class="productGrid">${Object.entries(PRODUCTS).map(([key,p])=>`<button class="productBtn" onclick="addDrink('${edit}','${key}')"><span>${p.icon}</span><b>${esc(p.name)}</b><small>${eu(p.price)}</small></button>`).join('')}</div>`;}if(sheet==='deposit'){let sel=edit||S.users.find(x=>x.role!=='tablet')?.id;b=`<h3>Guthaben einzahlen</h3><label>Mitglied</label><select id="du">${S.users.filter(x=>x.role!=='tablet').map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.name)}</option>`).join('')}</select><label>Betrag</label><input id="da" type="number" min="0.01" step="0.5"><label>Notiz</label><input id="dn" value="Guthaben-Einzahlung"><button class="btn blue block" onclick="deposit()">Einzahlen</button>`}if(sheet==='special')b=`<h3>Bierkasse buchen</h3><label>Art</label><select id="st"><option value="in">Einnahme</option><option value="out">Ausgabe</option></select><label>Betrag</label><input id="sa" type="number" min="0.01" step="0.01"><label>Grund</label><input id="sn" placeholder="Getränkeeinkauf …"><button class="btn block" onclick="special()">Buchen</button>`;if(sheet==='event')b=`<h3>Termin</h3><label>Titel</label><input id="et"><label>Datum</label><input id="ed" type="date" value="${today()}"><label>Uhrzeit</label><input id="ei" type="time"><label>Ort</label><input id="epl" value="Garagenstadion"><label>Notiz</label><textarea id="eno"></textarea><button class="btn block" onclick="addEvent()">Speichern</button>`;return `<div class="sheetBg" onclick="closeSheet()"><div class="sheet" onclick="event.stopPropagation()">${b}<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet()">Schließen</button></div></div>`}
function createClub(){let n=E('owner').value.trim(),p=E('pin').value.trim();if(!n||p.length<4)return alert('Name und PIN mit mind. 4 Zeichen.');let id=uid();S.club.name=E('club').value.trim()||'Garagenstadion';S.club.code=Math.random().toString(36).slice(2,8).toUpperCase();S.users=[{id,name:n,pin:p,role:'master',credit:0}];session={me:id,verified:true};audit('system','Garagenstadion eröffnet',id);save();render()}function verifyCode(){if(E('code').value.trim().toUpperCase()!==String(S.club.code).toUpperCase())return alert('Code falsch.');session.verified=true;persist();render()}function join(){let n=E('jn').value.trim(),p=E('jp').value,p2=E('jp2').value;if(!n||p.length<4)return alert('Name und PIN mit mindestens 4 Zeichen eingeben.');if(p!==p2)return alert('PINs stimmen nicht überein.');if(S.users.some(u=>u.name.trim().toLowerCase()===n.toLowerCase()))return alert('Der Name ist bereits vorhanden.');let id=uid();S.users.push({id,name:n,pin:p,role:'member',credit:0});session={me:id,verified:true,inviteHandled:String(S.club.code||'').trim().toUpperCase()};persist();audit('user','Mitglied per QR-Code beigetreten',id);clearInviteUrl();save();render()}function doLogin(){let u=S.users.find(x=>x.id===edit);if(!u||String(u.pin)!==E('lp').value)return alert('PIN falsch.');session.me=u.id;session.verified=true;session.inviteHandled=String(S.club.code||'').trim().toUpperCase();persist();clearInviteUrl();closeSheet()}function addTablet(){let n=E('un').value.trim(),p=E('up').value.trim();if(!n||p.length<4)return alert('Name/PIN fehlt.');let id=uid();S.users.push({id,name:n,pin:p,role:'tablet',credit:0});audit('user','Tablet-Account angelegt',id);save();closeSheet()}function editUser(){if(!master())return;let u=S.users.find(x=>x.id===edit),r=E('er').value;if(u.role==='master'&&r!=='master'&&S.users.filter(x=>x.role==='master').length===1)return alert('Der letzte Garagenmeister kann nicht herabgestuft werden.');u.name=E('en').value.trim();if(E('ep').value.trim())u.pin=E('ep').value.trim();u.role=r;audit('user','Benutzer geändert, Rolle: '+r,u.id);save();closeSheet()}function deleteUser(id){if(!master())return;let u=S.users.find(x=>x.id===id);if(u.role==='master'&&S.users.filter(x=>x.role==='master').length===1)return alert('Der letzte Garagenmeister kann nicht gelöscht werden.');if(!confirm('Benutzer und alle zugehörigen Striche löschen?'))return;audit('user','Benutzer gelöscht: '+u.name,id);S.users=S.users.filter(x=>x.id!==id);S.drinks=S.drinks.filter(x=>x.user!==id);save();closeSheet()}
function addDrink(id,productKey='beer'){if(!canStripe())return;let p=PRODUCTS[productKey]||PRODUCTS.beer,u=S.users.find(x=>x.id===id);if(!u)return alert('Mitglied nicht gefunden.');let price=Number(p.price),use=Math.min(credit(id),price);u.credit-=use;S.drinks.push({id:uid(),user:id,date:today(),product:productKey,productName:p.name,price,creditUsed:use,open:price-use,by:session.me,ts:new Date().toISOString()});audit('drink',p.name+' eingetragen · '+eu(price)+(use?' · vom Guthaben abgerechnet':''),id,price);save();sheet='';edit='';render()}function removeLast(id){if(!master())return;let a=S.drinks.filter(x=>x.user===id).sort((x,y)=>String(y.ts).localeCompare(String(x.ts)))[0];if(!a)return;S.users.find(x=>x.id===id).credit+=Number(a.creditUsed||0);S.drinks=S.drinks.filter(x=>x.id!==a.id);audit('drink','Letzten Strich korrigiert/entfernt',id,a.price);save();render()}function deposit(){if(!master())return;let id=E('du').value,a=Number(E('da').value),n=E('dn').value.trim()||'Guthaben-Einzahlung';if(a<=0)return alert('Betrag fehlt.');let u=S.users.find(x=>x.id===id),left=a;S.drinks.filter(x=>x.user===id&&x.open>0).sort((x,y)=>String(x.ts).localeCompare(String(y.ts))).forEach(x=>{let q=Math.min(left,x.open);x.open-=q;x.creditUsed+=q;left-=q});u.credit+=left;S.cash.push({id:uid(),user:id,amount:a,note:n,type:'deposit',ts:new Date().toISOString(),by:session.me});audit('cash','Guthaben eingezahlt: '+eu(a),id,a);save();closeSheet()}function special(){if(!master())return;let a=Math.abs(Number(E('sa').value)),n=E('sn').value.trim();if(!a||!n)return alert('Betrag und Grund fehlen.');if(E('st').value==='out')a=-a;S.cash.push({id:uid(),amount:a,note:n,type:'special',ts:new Date().toISOString(),by:session.me});audit('cash',(a>0?'Einnahme: ':'Ausgabe: ')+n+' '+eu(a),null,a);save();closeSheet()}function addEvent(){if(!master())return;let t=E('et').value.trim(),d=E('ed').value;if(!t||!d)return alert('Titel und Datum fehlen.');S.events.push({id:uid(),title:t,date:d,time:E('ei').value,place:E('epl').value.trim(),note:E('eno').value.trim(),responses:{}});audit('event','Termin angelegt: '+t);save();closeSheet()}function delEvent(id){if(!master())return;let e=S.events.find(x=>x.id===id);if(confirm('Termin löschen?')){S.events=S.events.filter(x=>x.id!==id);audit('event','Termin gelöscht: '+e.title);save();render()}}function exportBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='garagenstadion-backup-'+today()+'.json';a.click()}
start();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=4.6').catch(console.error));
</script></body></html>
